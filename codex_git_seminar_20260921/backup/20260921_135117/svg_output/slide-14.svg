  <g id="track-ignore" data-pptx-bounds="856 180 360 432">
    <rect x="856" y="180" width="360" height="202" rx="4" fill="#F1F5F3"/>
    <text x="880" y="220" font-size="22" font-weight="700" fill="#527A75">应该追踪</text>
    <text x="880" y="258" font-size="18" fill="#263238"><tspan x="880" y="258">• 源代码与评估脚本</tspan><tspan x="880" y="292">• 配置与环境依赖</tspan><tspan x="880" y="326">• 数据获取说明</tspan><tspan x="880" y="360">• 图表生成方法</tspan></text>
