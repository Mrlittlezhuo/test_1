    <text x="880" y="442" font-size="22" font-weight="700" fill="#263238">应该忽略或外部管理</text>
    <text x="880" y="480" font-size="18" fill="#263238"><tspan x="880" y="480">• 密钥、缓存与临时文件</tspan><tspan x="880" y="514">• 大型原始数据</tspan><tspan x="880" y="548">• 可由脚本重建的输出</tspan></text>
