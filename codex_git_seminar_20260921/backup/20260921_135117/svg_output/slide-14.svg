  <g id="footer" data-pptx-bounds="64 640 1152 32"><text x="64" y="662" font-size="15" fill="#607078">分支不是越多越好：一个研究假设或修复，对应一个短而清楚的分支。</text><text x="1216" y="662" text-anchor="end" font-size="14" fill="#819096">14</text></g>
