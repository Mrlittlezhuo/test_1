      <circle cx="96" cy="430" r="18" stroke="#263238"/><circle cx="190" cy="430" r="10" stroke="#263238"/><circle cx="360" cy="430" r="10" stroke="#263238"/><circle cx="530" cy="430" r="10" stroke="#263238"/><circle cx="806" cy="430" r="18" stroke="#648681"/>
      <circle cx="340" cy="300" r="14" stroke="#456779"/><circle cx="520" cy="350" r="14" stroke="#648681"/><circle cx="680" cy="250" r="14" stroke="#6C8DFF"/>
    </g>
    <text x="120" y="470" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">main 基线</text>
    <text x="340" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#355F70">实验 A · config-a</text>
    <text x="520" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#527A75">实验 B · config-b</text>
    <text x="680" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#4C68CC">实验 C · config-c</text>
    <text x="780" y="470" text-anchor="middle" font-size="17" font-weight="700" fill="#527A75">验证后合并</text>
    <rect x="64" y="510" width="760" height="102" rx="4" fill="#FFFFFF" stroke="#D8DEE0"/>
    <text x="88" y="546" font-size="18" font-weight="700" fill="#263238">一个提交应同时指向三类证据</text>
    <text x="88" y="580" font-size="18" fill="#263238">代码与配置变化　·　环境与数据获取说明　·　指标摘要或结果索引</text>
