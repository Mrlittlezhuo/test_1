    <line x1="250" y1="300" x2="430" y2="300" stroke="#456779" stroke-width="4"/>
    <line x1="430" y1="300" x2="500" y2="430" stroke="#456779" stroke-width="4"/>
    <line x1="360" y1="430" x2="430" y2="350" stroke="#648681" stroke-width="4"/>
