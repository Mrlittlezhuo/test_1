<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header" data-pptx-bounds="64 38 1152 120">
    <text x="64" y="88" font-size="38" font-weight="700" fill="#263238">项目规则与可复用技能</text>
    <text x="64" y="126" font-size="20" fill="#607078">两类文件分别解决长期约定和特定任务的操作方法。</text>
    <line x1="64" y1="154" x2="1216" y2="154" stroke="#D8DEE0"/>
  </g>
  <g id="agents-column" data-pptx-bounds="64 194 530 390">
    <text x="64" y="228" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#263238">AGENTS.md</text>
    <text x="64" y="272" font-size="20" fill="#263238">项目内持续生效的工作约定。</text>
    <line x1="64" y1="294" x2="594" y2="294" stroke="#D8DEE0"/>
    <text x="64" y="338" font-size="18" fill="#263238">通常包括</text>
    <text x="88" y="382" font-size="19" fill="#263238">测试与运行命令</text>
    <text x="88" y="426" font-size="19" fill="#263238">目录职责和修改范围</text>
    <text x="88" y="470" font-size="19" fill="#263238">数据、提交和删除的限制</text>
    <text x="88" y="514" font-size="19" fill="#263238">完成任务后的汇报要求</text>
    <text x="64" y="570" font-size="17" fill="#607078">例如：修改前检查 Git 状态，完成后运行测试。</text>
  </g>
  <g id="skill-column" data-pptx-bounds="686 194 530 390">
    <text x="686" y="228" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#263238">Skill</text>
    <text x="686" y="272" font-size="20" fill="#263238">针对一类重复任务的操作手册。</text>
    <line x1="686" y1="294" x2="1216" y2="294" stroke="#D8DEE0"/>
    <text x="686" y="338" font-size="18" fill="#263238">一个技能目录可以这样组织</text>
    <g font-family="Consolas, monospace" font-size="20" fill="#263238">
      <text x="710" y="382">experiment-audit/</text>
      <text x="738" y="422">├─ SKILL.md</text>
      <text x="738" y="462">├─ scripts/</text>
      <text x="738" y="502">├─ references/</text>
      <text x="738" y="542">└─ assets/</text>
    </g>
    <text x="686" y="578" font-size="17" fill="#607078">其中 SKILL.md 必需，其余目录按任务需要添加。</text>
  </g>
  <g id="footer" data-pptx-bounds="64 620 1152 64">
    <line x1="64" y1="620" x2="1216" y2="620" stroke="#D8DEE0"/>
    <text x="64" y="653" font-size="15" fill="#607078"><tspan x="64" y="653"><a href="https://learn.chatgpt.com/docs/agent-configuration/agents-md"><tspan fill="#355F70" text-decoration="underline">AGENTS.md 官方文档</tspan></a><tspan>　·　</tspan><a href="https://learn.chatgpt.com/docs/build-skills"><tspan fill="#355F70" text-decoration="underline">Skills 官方文档</tspan></a></tspan></text>
    <text x="1216" y="653" text-anchor="end" font-size="14" fill="#819096">05</text>
  </g>
</svg>
