<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#377DFF"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#20B8CD"/></marker></defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
  <g id="header" data-pptx-bounds="64 36 1152 116">
    <text x="64" y="86" font-size="44" font-weight="700" fill="#14213D">Codex 负责执行，Git 负责建立可信检查点</text>
    <text x="64" y="126" font-size="21" fill="#667085">AI 产生变化之前先有基线；变化之后必须有 diff、验证证据和可恢复提交。</text>
    <g transform="translate(1016 48)" font-size="14" font-weight="700"><text x="0" y="18" fill="#98A2B3">CODEX</text><text x="72" y="18" fill="#98A2B3">GIT</text><text x="116" y="18" fill="#377DFF">RESEARCH</text><rect x="116" y="28" width="74" height="3" rx="1.5" fill="#377DFF"/></g>
  </g>
  <g id="trusted-research-loop" data-pptx-bounds="64 176 1152 438">
    <line x1="364" y1="240" x2="452" y2="240" stroke="#377DFF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="752" y1="240" x2="840" y2="240" stroke="#377DFF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="990" y1="294" x2="990" y2="444" stroke="#20B8CD" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <line x1="840" y1="500" x2="752" y2="500" stroke="#20B8CD" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <line x1="452" y1="500" x2="364" y2="500" stroke="#20B8CD" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <g>
      <rect x="64" y="186" width="300" height="108" rx="20" fill="#FFFFFF" stroke="#BFD2FA" stroke-width="2"/>
      <circle cx="98" cy="220" r="18" fill="#377DFF"/><text x="98" y="227" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
      <text x="128" y="222" font-size="21" font-weight="700" fill="#14213D">人：定义任务与标准</text><text x="88" y="263" font-size="17" fill="#667085">目标 · 相关文件 · 验收条件</text>
      <rect x="452" y="186" width="300" height="108" rx="20" fill="#FFFFFF" stroke="#BFE8ED" stroke-width="2"/>
      <circle cx="486" cy="220" r="18" fill="#20B8CD"/><text x="486" y="227" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
      <text x="516" y="222" font-size="21" font-weight="700" fill="#14213D">Git：建立干净基线</text><text x="476" y="263" font-size="17" fill="#667085">状态清楚 · 可比较 · 可回退</text>
      <rect x="840" y="186" width="376" height="108" rx="20" fill="#14213D"/>
      <circle cx="874" cy="220" r="18" fill="#377DFF"/><text x="874" y="227" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
      <text x="904" y="222" font-size="21" font-weight="700" fill="#FFFFFF">Codex：分析、修改、运行检查</text><text x="864" y="263" font-size="17" fill="#B8C7E0">项目上下文 · 最小变更 · 验证结果</text>
      <rect x="840" y="446" width="376" height="108" rx="20" fill="#FFFFFF" stroke="#BFD2FA" stroke-width="2"/>
      <circle cx="874" cy="480" r="18" fill="#377DFF"/><text x="874" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
      <text x="904" y="482" font-size="21" font-weight="700" fill="#14213D">人：审查 diff、结果与风险</text><text x="864" y="523" font-size="17" fill="#667085">决定保留、修正或回退</text>
      <rect x="452" y="446" width="300" height="108" rx="20" fill="#FFFFFF" stroke="#BFE8ED" stroke-width="2"/>
      <circle cx="486" cy="480" r="18" fill="#20B8CD"/><text x="486" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">5</text>
      <text x="516" y="482" font-size="21" font-weight="700" fill="#14213D">Git：提交并推送</text><text x="476" y="523" font-size="17" fill="#667085">只提交当前任务文件</text>
      <rect x="64" y="446" width="300" height="108" rx="20" fill="#EAF8FA"/>
      <circle cx="98" cy="480" r="18" fill="#14213D"/><text x="98" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">6</text>
      <text x="128" y="482" font-size="21" font-weight="700" fill="#14213D">记录结果来源</text><text x="88" y="523" font-size="17" fill="#667085">提交号 → 实验记录 → 论文图表</text>
    </g>
    <rect x="240" y="334" width="800" height="72" rx="20" fill="#EAF2FF"/>
    <text x="640" y="366" text-anchor="middle" font-size="19" font-weight="700" fill="#245FD1">可信变化 = clean baseline + diff + verification evidence + commit</text>
    <text x="640" y="392" text-anchor="middle" font-size="16" fill="#667085">Codex 提高执行效率，Git 把每一步变成可检查、可恢复的事实。</text>
  </g>
  <g id="footer" data-pptx-bounds="64 640 1152 32"><text x="64" y="662" font-size="15" fill="#667085">角色分工：人负责目标与判断，Codex 负责执行，Git 负责历史与证据。</text><text x="1216" y="662" text-anchor="end" font-size="14" fill="#98A2B3">15</text></g>
</svg>
