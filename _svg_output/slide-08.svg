<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#377DFF"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#20B8CD"/></marker></defs>
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F8FB"/>
  <g id="header" data-pptx-bounds="64 36 1152 116">
    <text x="64" y="86" font-size="44" font-weight="700" fill="#14213D">一次 Git 提交，要经过四个位置</text>
    <text x="64" y="126" font-size="21" fill="#667085">理解“文件现在在哪里”，命令就不再需要死记。</text>
    <g transform="translate(1016 48)" font-size="14" font-weight="700"><text x="0" y="18" fill="#98A2B3">CODEX</text><text x="72" y="18" fill="#20B8CD">GIT</text><text x="116" y="18" fill="#98A2B3">RESEARCH</text><rect x="72" y="28" width="26" height="3" rx="1.5" fill="#20B8CD"/></g>
  </g>
  <g id="git-four-zones" data-pptx-bounds="64 186 1152 372">
    <line x1="286" y1="330" x2="374" y2="330" stroke="#377DFF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="596" y1="330" x2="684" y2="330" stroke="#377DFF" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <line x1="906" y1="330" x2="994" y2="330" stroke="#20B8CD" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <line x1="994" y1="398" x2="906" y2="398" stroke="#20B8CD" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <text x="330" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#245FD1">git add</text>
    <text x="640" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#245FD1">git commit</text>
    <text x="950" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#168FA0">git push</text>
    <text x="950" y="432" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#168FA0">git pull</text>
    <g>
      <rect x="64" y="256" width="222" height="190" rx="20" fill="#FFFFFF" stroke="#BFD2FA" stroke-width="2"/>
      <text x="88" y="298" font-size="17" font-weight="700" fill="#377DFF">01</text><text x="88" y="336" font-size="25" font-weight="700" fill="#14213D">工作区</text><text x="88" y="366" font-size="17" fill="#667085">Working Tree</text><text x="88" y="412" font-size="18" fill="#1D2939">正在编辑的文件</text>
      <rect x="374" y="256" width="222" height="190" rx="20" fill="#FFFFFF" stroke="#BFD2FA" stroke-width="2"/>
      <text x="398" y="298" font-size="17" font-weight="700" fill="#377DFF">02</text><text x="398" y="336" font-size="25" font-weight="700" fill="#14213D">暂存区</text><text x="398" y="366" font-size="17" fill="#667085">Staging Area</text><text x="398" y="402" font-size="18" fill="#1D2939"><tspan x="398" y="402">本次提交准备</tspan><tspan x="398" y="428">包含的内容</tspan></text>
      <rect x="684" y="256" width="222" height="190" rx="20" fill="#FFFFFF" stroke="#BFE8ED" stroke-width="2"/>
      <text x="708" y="298" font-size="17" font-weight="700" fill="#20B8CD">03</text><text x="708" y="336" font-size="25" font-weight="700" fill="#14213D">本地仓库</text><text x="708" y="366" font-size="17" fill="#667085">Local Repository</text><text x="708" y="402" font-size="18" fill="#1D2939"><tspan x="708" y="402">已固化、可恢复的</tspan><tspan x="708" y="428">提交历史</tspan></text>
      <rect x="994" y="256" width="222" height="190" rx="20" fill="#14213D"/>
      <text x="1018" y="298" font-size="17" font-weight="700" fill="#7EE0CF">04</text><text x="1018" y="336" font-size="25" font-weight="700" fill="#FFFFFF">远程仓库</text><text x="1018" y="366" font-size="17" fill="#B8C7E0">Remote Repository</text><text x="1018" y="402" font-size="18" fill="#FFFFFF"><tspan x="1018" y="402">团队同步与远程</tspan><tspan x="1018" y="428">备份协作</tspan></text>
    </g>
    <rect x="64" y="486" width="1152" height="72" rx="16" fill="#FFFFFF" stroke="#D9E1EC"/>
    <text x="88" y="516" font-size="17" font-weight="700" fill="#14213D">观察状态</text>
    <text x="88" y="544" font-size="17" fill="#1D2939"><tspan font-family="Consolas, monospace" fill="#245FD1">git status</tspan> 看位置　·　<tspan font-family="Consolas, monospace" fill="#245FD1">git diff</tspan> 看差异　·　<tspan font-family="Consolas, monospace" fill="#245FD1">git log</tspan> 看历史</text>
  </g>
  <g id="footer" data-pptx-bounds="64 592 1152 88"><rect x="64" y="592" width="1152" height="56" rx="16" fill="#EAF2FF"/><text x="88" y="627" font-size="18" fill="#1D2939"><tspan font-weight="700" fill="#245FD1">暂存区的价值：</tspan>先选择“这次要提交什么”，再固化历史。</text><text x="1216" y="670" text-anchor="end" font-size="14" fill="#98A2B3">08</text></g>
</svg>
